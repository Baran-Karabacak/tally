services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally_dev
      POSTGRES_DB: tally
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tally_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tally_pgdata:
